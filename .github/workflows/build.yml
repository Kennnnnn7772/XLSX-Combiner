name: Build XLSX Combiner

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --clean --noconfirm --name Combine_XLSX combine_xlsx.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Combine_XLSX_Windows_x64
          path: dist/Combine_XLSX.exe
